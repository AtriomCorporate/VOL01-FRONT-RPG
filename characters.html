<!doctype html>
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/CamPresona.css" />
    <link rel="stylesheet" href="./css/menu.css" />
    <link rel="stylesheet" href="./css/table.css" />
    <link rel="stylesheet" href="./css/footer.css" />
    <title>Personagens</title>
  </head>
  <body>
    <nav id="menu">
      <a href="./index.html">Início</a>
      <a href="./characters.html">Personagens</a>
      <a href="./campaigns.html">Campanhas</a>
      <a href="./login.html">Login</a>
      <a href="./convidado.html">Convidado</a>
      <a href="./register.html">Cadastro</a>
    </nav>
    <main>
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Classe</th>
            <th>Raça</th>
            <th>Campanha</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="characterTable"></tbody>
      </table>

      <div class="container">
        <h2>Criar ou editar personagem</h2>
        <form id="form">
          <label for="name">Nome do Personagem:</label>
          <input type="text" id="name" name="name" />
          <label for="class">Classe:</label>
          <textarea id="class" name="class"></textarea>

          <label for="race">Raça:</label>
          <input type="text" id="race" name="race" />
          <label for="campaign">Campanha:</label>
          <input type="text" id="campaign" name="campaign" />
          <div id="feedback"></div>
          <button type="submit">Salvar</button>
        </form>
      </div>
    </main>
    <footer>
      <p>Gerenciador de RPG.</p>
    </footer>
    <script src="./js/characters.js"></script>
  </body>
</html>
